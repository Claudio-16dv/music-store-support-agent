[project]
name = "music-store-support-agent"
version = "0.1.0"
description = "Customer service agent for Empório da Música (AI Engineer technical challenge)"
requires-python = ">=3.11"
dependencies = ["openai>=3,<4", "pypdf>=6,<7", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
emporio = "emporio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
